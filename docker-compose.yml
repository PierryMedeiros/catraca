# Projeto Compose = nome da pasta (sem chave "name:"), para que worktrees
# paralelas não compartilhem containers nem volumes.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 2s
      timeout: 5s
      retries: 30
    # Sem porta publicada no host (evita conflito entre worktrees).
    # Acesso manual: docker compose exec -T db psql -U catraca -d catraca

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://catraca:catraca@db:5432/catraca
      TZ: ${TZ:-America/Sao_Paulo}
      SESSION_SECRET: ${SESSION_SECRET:-catraca-sessao-local}
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-parceiro-2026}
      # Sem GATEWAY_*: o app usa os atrasos padrão do brief (2000/65000 ms,
      # polling 500 ms). Atrasos menores só nos gates (docker-compose.gates.yml).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata: {}
